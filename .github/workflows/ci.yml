name: CI

# Enforces the repo's core promise — "every number is reproducible" — on every
# push and PR. The metric verification and the test suite both run on the Python
# standard library plus pytest; no Snowflake account is touched.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify metrics reproduce from source CSVs
        run: python verify_metrics.py

      - name: Validate pipeline plan (dry run)
        run: python run_pipeline.py --dry-run

      - name: Run data-contract + metric-regression tests
        run: python -m pytest -q
